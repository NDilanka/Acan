<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acan</title>
<style>
  :root {
    --page: #f2f2ef;
    --card: #fbfbfa;
    --face: #ffffff;
    --ink: #1f1f1d;
    --muted: #7a7a72;
    --rule: #dcdcd6;
    --red: #c8402e;
    --mono: "IBM Plex Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 13px/1.35 var(--sans); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
  header { display: flex; gap: 18px; align-items: baseline; padding: 9px 16px; border-bottom: 1px solid var(--rule); }
  .brand { font-weight: 600; letter-spacing: 0.02em; }
  .muted { color: var(--muted); }
  #order-line { font-family: var(--mono); font-size: 12px; }
  #link { margin-left: auto; font-family: var(--mono); font-size: 11px; }
  main { position: relative; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; outline: none; }
  #pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pin { position: absolute; left: 0; top: 0; white-space: nowrap; font: 11px/1.2 var(--mono); }
  .pin.machine { color: var(--muted); }
  .pin.order { color: var(--ink); background: var(--card); border: 1px solid var(--rule); padding: 1px 6px; border-radius: 3px; }
  .pin.flag { font-weight: 600; }
  .pin.question { color: var(--ink); background: var(--card); border: 1px dashed var(--muted); padding: 1px 6px; border-radius: 3px; }
  .pin.clash { pointer-events: auto; cursor: pointer; color: var(--red); }
  .pin.clash .diamond { position: absolute; left: -7px; top: -7px; width: 12px; height: 12px; background: var(--red); transform: rotate(45deg); }
  .pin.clash .text { position: absolute; left: 12px; top: -8px; background: var(--card); padding: 0 3px; }
  .pin.clash.resolved { color: var(--muted); }
  .pin.clash.resolved .diamond { background: none; border: 1.5px solid var(--muted); }
  .pin.clash.selected .text { outline: 1px solid var(--red); }
  #card { position: absolute; right: 16px; top: 16px; width: 300px; box-sizing: border-box; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
  #card h2 { margin: 0 0 6px; font: 600 13px/1.3 var(--mono); color: var(--red); }
  #card p { margin: 6px 0; }
  #card ol { list-style: none; margin: 8px 0 0; padding: 0; }
  #card li { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
  #card button { font: 12px/1.3 var(--mono); text-align: left; background: var(--face); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 8px; cursor: pointer; flex: 1; }
  #card button:hover { border-color: var(--ink); }
  #card button:disabled { color: var(--muted); cursor: default; }
  #card .key { font-family: var(--mono); color: var(--muted); min-width: 10px; }
  #card .note { font-family: var(--mono); font-size: 11px; color: var(--red); }
  #card .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
  #gate { position: absolute; inset: 0; display: grid; place-items: center; }
  #gate form { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: flex; gap: 8px; align-items: center; }
  #gate input { font: 12px var(--mono); padding: 4px 6px; width: 280px; }
  #gate button { font: 12px var(--mono); padding: 4px 10px; }
  footer { border-top: 1px solid var(--rule); padding: 8px 16px; }
  footer h3 { margin: 0 0 4px; font: 600 11px/1.2 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  table { border-collapse: collapse; font: 12px/1.4 var(--mono); }
  th, td { text-align: left; padding: 1px 16px 1px 0; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.offline { color: var(--muted); }
  td.live { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header>
  <span class="brand">acan</span>
  <span id="order-line" class="muted"></span>
  <span id="link" class="muted">starting</span>
</header>
<main id="stage">
  <canvas id="plant" tabindex="0"></canvas>
  <div id="pins"></div>
  <aside id="card" hidden></aside>
  <div id="gate" hidden>
    <form id="token-form">
      <label for="token" class="muted">owner token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
      <button type="submit">open</button>
    </form>
  </div>
</main>
<footer>
  <h3>usage</h3>
  <table>
    <thead>
      <tr><th>role</th><th>model</th><th>provider</th><th>calls</th><th>prompt tokens</th><th>completion tokens</th></tr>
    </thead>
    <tbody id="usage-body"><tr><td class="muted" colspan="6">no model calls yet</td></tr></tbody>
  </table>
</footer>
<script type="module" src="main.js"></script>
</body>
</html>
