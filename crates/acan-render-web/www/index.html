<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acan</title>
<style>
  :root {
    --page: #f2f2ef;
    --card: #fbfbfa;
    --face: #ffffff;
    --ink: #1f1f1d;
    --muted: #7a7a72;
    --rule: #dcdcd6;
    --red: #d0453a;
    --amber: #d99a1e;
    --mono: "IBM Plex Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 13px/1.35 var(--sans); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas.dragging { cursor: grabbing; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  /* A paper halo round the text, so no belt or grid line crosses a word. */
  .label { position: absolute; left: 0; top: 0; white-space: nowrap;
    font: 12px system-ui, sans-serif; color: #57575a;
    text-shadow: 1.5px 0 0 #fff, -1.5px 0 0 #fff, 0 1.5px 0 #fff, 0 -1.5px 0 #fff,
      1px 1px 0 #fff, -1px 1px 0 #fff, 1px -1px 0 #fff, -1px -1px 0 #fff, 0 0 3px #fff; }
  #labels.alt .label { background: rgba(255, 255, 255, 0.92); border-radius: 4px; padding: 0 5px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05); }
  .label .count { display: none; margin-left: 6px; color: #8a8a8f; }
  #labels.alt .count { display: inline; }
  /* Flags are the marks the plant draws: an agent with its activity, the order, a clash, a
     question. Each is one fixed-size label with a hue dot; an amber dot means it waits on you. */
  #flags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .flag { position: absolute; left: 0; top: 0; display: flex; gap: 5px; align-items: center; white-space: nowrap;
    font: 11px/1.2 var(--mono); color: var(--ink); background: var(--face); border: 1px solid var(--rule);
    border-radius: 3px; padding: 2px 6px; }
  .flag.question { border-style: dashed; }
  .flag .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .flag .dot.wait { background: var(--amber); }
  .flag.clash { pointer-events: auto; cursor: pointer; color: var(--red); border-color: var(--red); }
  .island { position: fixed; background: var(--face); border: 1px solid #e5e5e2; border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 18px rgba(0, 0, 0, 0.06); padding: 6px 12px; }
  #shell { top: 12px; left: 12px; display: flex; gap: 10px; align-items: baseline; }
  .brand { font-weight: 600; letter-spacing: 0.02em; }
  .repo, .muted { color: var(--muted); }
  #order { top: 52px; left: 12px; max-width: 56vw; font: 12px/1.4 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #link { font: 11px var(--mono); }
  #hint { top: 12px; left: 50%; transform: translateX(-50%); color: #57575a; white-space: nowrap; }
  kbd { font: 11px ui-monospace, Consolas, monospace; color: var(--ink); background: var(--face);
    border: 1px solid #e5e5e2; border-radius: 4px; padding: 0 4px; }
  #card { position: fixed; right: 16px; top: 16px; width: 300px; box-sizing: border-box; background: #ffffff; border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
  #card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #card h2 { margin: 0 0 6px; font: 600 13px/1.3 var(--mono); color: var(--ink); }
  #card p { margin: 6px 0; }
  #card .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  #card .row .muted { font-size: 11px; }
  #card .row.witness { color: var(--red); font-family: var(--mono); }
  #card .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #card .resolved { font-family: var(--mono); color: var(--muted); }
  #card ol { list-style: none; margin: 8px 0 0; padding: 0; }
  #card ol.keys li { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 2px 0; }
  #card button { font: 12px/1.3 var(--mono); text-align: left; background: var(--face); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 8px; cursor: pointer; flex: 1; }
  #card button.close { flex: none; font-size: 11px; color: var(--muted); border: none; background: none; padding: 0; }
  #card button:hover { border-color: var(--ink); }
  #card button:disabled { color: var(--muted); cursor: default; }
  #card .key { font-family: var(--mono); color: var(--muted); min-width: 10px; }
  #card .note { font-family: var(--mono); font-size: 11px; color: var(--red); }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; }
  #gate form { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: flex; gap: 8px; align-items: center; }
  #gate input { font: 12px var(--mono); padding: 4px 6px; width: 280px; }
  #gate button { font: 12px var(--mono); padding: 4px 10px; }
  #usage { left: 12px; bottom: 12px; }
  #usage h3 { margin: 0 0 4px; font: 600 11px/1.2 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  table { border-collapse: collapse; font: 12px/1.4 var(--mono); }
  th, td { text-align: left; padding: 1px 16px 1px 0; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.offline { color: var(--muted); }
  td.live { color: var(--ink); font-weight: 600; }
  #notice { top: 50%; left: 50%; transform: translate(-50%, -50%); color: #57575a; }
</style>
</head>
<body>
<canvas id="plant" tabindex="0"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="flags" aria-live="polite"></div>
<div class="island" id="shell"><span class="brand">Acan</span><span class="repo" id="repo"></span><span id="link" class="muted">starting</span></div>
<div class="island" id="order" hidden><span id="order-line" class="muted"></span></div>
<div class="island" id="hint"><kbd>Alt</kbd> words&nbsp;&nbsp;<kbd>Q</kbd><kbd>E</kbd> turn&nbsp;&nbsp;<kbd>0</kbd> fit&nbsp;&nbsp;<kbd>5</kbd> ortho&nbsp;&nbsp;<kbd>C</kbd> card&nbsp;&nbsp;<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> settle</div>
<aside id="card" class="island" hidden></aside>
<div id="gate" hidden>
  <form id="token-form">
    <label for="token" class="muted">owner token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button type="submit">open</button>
  </form>
</div>
<div class="island" id="usage" hidden>
  <h3>usage</h3>
  <table id="usage-table" hidden>
    <thead>
      <tr><th>role</th><th>model</th><th>provider</th><th>calls</th><th>prompt tokens</th><th>completion tokens</th></tr>
    </thead>
    <tbody id="usage-body"></tbody>
  </table>
  <p id="usage-none" class="muted" hidden>no model calls yet</p>
</div>
<div class="island" id="notice" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
