<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acan</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body { font: 13px system-ui, sans-serif; color: #26262a; }
  [hidden] { display: none !important; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; white-space: nowrap;
    font: 12px system-ui, sans-serif; color: #57575a; }
  .label .count { display: none; margin-left: 6px; color: #8a8a8f; }
  #labels.alt .count { display: inline; }
  .island { position: fixed; background: #ffffff; border: 1px solid #e5e5e2; border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 18px rgba(0, 0, 0, 0.06);
    padding: 6px 12px; }
  #shell { top: 12px; left: 12px; display: flex; gap: 8px; align-items: baseline; }
  .brand { font-weight: 600; }
  .repo { color: #57575a; }
  #hint { top: 12px; left: 50%; transform: translateX(-50%); color: #57575a; white-space: nowrap; }
  kbd { font: 11px ui-monospace, Consolas, monospace; color: #26262a; background: #ffffff;
    border: 1px solid #e5e5e2; border-radius: 4px; padding: 0 4px; }
  #notice { top: 50%; left: 50%; transform: translate(-50%, -50%); color: #57575a; }
</style>
</head>
<body>
<canvas id="plant"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="island" id="shell"><span class="brand">Acan</span><span class="repo" id="repo"></span></div>
<div class="island" id="hint"><kbd>Alt</kbd> words&nbsp;&nbsp;<kbd>Q</kbd><kbd>E</kbd> turn&nbsp;&nbsp;<kbd>0</kbd> fit</div>
<div class="island" id="notice" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
