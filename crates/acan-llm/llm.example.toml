# Copy to llm.toml (git ignores it). Keys never go in this file. Each provider names the
# environment variable that holds its key.
#
# Muse Spark is the foreman, served by Meta. Muse Spark Open runs on two hosts, Baseten and
# Fireworks. Those are two providers for one model, not two vendors.

[[providers]]
name = "meta"
base_url = "https://api.meta.ai/v1"
api_key_env = "META_API_KEY"
default_model = "muse-spark-1.3"
structured_output = "json_schema"
# Meta's docs make max_completion_tokens canonical and max_tokens a deprecated alias.
token_limit_field = "max_completion_tokens"
timeout_secs = 120

[[providers]]
name = "baseten"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
default_model = "meta-models/muse-spark-open-1026"
# Switch to "prompt" if Baseten rejects response_format.
structured_output = "json_schema"
timeout_secs = 120

[[providers]]
name = "fireworks"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
default_model = "accounts/fireworks/models/muse-spark-open"
structured_output = "json_schema"
timeout_secs = 120

# To add another OpenAI-compatible provider, add a [[providers]] block with its own
# api_key_env, then point a role at it with one line below.

[routing.foreman]
provider = "meta"

[routing.worker]
provider = "baseten"

[routing.fast]
provider = "baseten"
