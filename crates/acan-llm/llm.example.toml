# Copy to llm.toml (git ignores it) and confirm the base URLs before the live smoke test.
# Keys never go in this file. Each provider names the environment variable that holds its key.

[[providers]]
name = "meta"
# PLACEHOLDER: confirm the Meta Model API base URL, including any /v1 prefix.
base_url = "https://REPLACE-WITH-META-MODEL-API-BASE-URL/v1"
api_key_env = "META_API_KEY"
default_model = "muse-spark-1.3"
structured_output = "json_schema"
timeout_secs = 120

[[providers]]
name = "baseten"
# PLACEHOLDER: confirm the Baseten base URL for meta-models/muse-spark-open-1026.
base_url = "https://REPLACE-WITH-BASETEN-BASE-URL/v1"
api_key_env = "BASETEN_API_KEY"
default_model = "meta-models/muse-spark-open-1026"
# Switch to "prompt" if Baseten rejects response_format.
structured_output = "json_schema"
timeout_secs = 120

# To add another OpenAI-compatible provider (for example Fireworks), add a [[providers]]
# block with its own api_key_env, then point a role at it with one line below.

[routing.foreman]
provider = "meta"

[routing.worker]
provider = "baseten"

[routing.fast]
provider = "baseten"
