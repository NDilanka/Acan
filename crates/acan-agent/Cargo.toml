[package]
name = "acan-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Acan's worker harness: a model-driven worker that takes a task from the origin over MCP"

[[bin]]
name = "acan-worker"
path = "src/main.rs"

[dependencies]
acan-llm = { path = "../acan-llm" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
acan-core = { path = "../acan-core" }
acan-server = { path = "../acan-server" }
tempfile = "3"
